name: Release

# Publish on a version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

jobs:
  # ── Python package → PyPI + a GitHub Release with the built artifacts ──────
  pypi:
    runs-on: ubuntu-latest
    environment: release        # configure required reviewers / the PyPI publisher here
    permissions:
      id-token: write           # OIDC for PyPI Trusted Publishing (no token needed)
      contents: write           # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != pyproject version $VER (bump pyproject.toml)"; exit 1; }

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing: on PyPI, add a publisher for this repo + workflow
        # (Publishing → Add a pending publisher: workflow "release.yml",
        #  environment "release"). No secret required.
        #
        # Token alternative — comment out the block above and use:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  # ── Container image → GitHub Container Registry (ghcr.io) ──────────────────
  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # auto-lowercased
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
